<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR付きマトリックスシミュレーション</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    margin:10px;
    padding:0;
}

h3,h4{
    margin-top:15px;
}

.table-container{
    overflow-x:auto;
}

table{
    border-collapse:collapse;
    margin-bottom:20px;
    width:100%;
    max-width:600px;
}

td,th{
    border:1px solid #999;
    padding:10px;
    text-align:center;
    min-width:60px;
}

.selected{
    background-color:yellow;
    font-weight:bold;
}

#calcSection{
    display:none;
}

#qrcode{
    margin-top:10px;
}

input{
    width:100%;
    max-width:250px;
    padding:10px;
    margin:5px 0;
    box-sizing:border-box;
    font-size:16px;
}

button{
    padding:12px 16px;
    margin:5px 0;
    font-size:16px;
    cursor:pointer;
}

@media (max-width:600px){

    td,th{
        padding:8px;
        min-width:50px;
        font-size:14px;
    }

    button{
        width:100%;
    }

    input{
        max-width:100%;
    }
}
</style>
</head>

<body>

<h3>① マトリックス（5行×4列 = 20マス）</h3>

<div class="table-container">
<table id="matrix">
    <thead>
        <tr>
            <th></th>
            <th>A</th>
            <th>B</th>
            <th>C</th>
            <th>D</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
</div>

<h3>② 番号を入力してください（1〜20）</h3>

<input type="number" id="matrixInput" min="1" max="20">

<button onclick="selectMatrix()">
    マトリックス選択
</button>

<div id="calcSection">

    <h3>④ 計算書</h3>

    <p>(Bond - Stock) / T = O</p>

    <label>
        Bond:
        <input type="number" id="bondInput">
    </label>

    <br>

    <label>
        Stock:
        <input type="number" id="stockInput">
    </label>

    <br>

    <label>
        T:
        <input type="number" id="tInput">
    </label>

    <br><br>

    <button onclick="startSimulation()">
        シミュレーション開始
    </button>

    <button onclick="stopSimulation()">
        停止
    </button>

    <h4>
        出力 O =
        <span id="output">--</span>
    </h4>

    <div id="qrcode"></div>

    <button onclick="readQRCode()">
        QRコード読み取り
    </button>

    <h4>
        QR読み取り出力：
        <span id="qrOutput">--</span>
    </h4>

</div>

<script>

const verticalLabels = ['A','B','C','D','E'];
const horizontalLabels = ['A','B','C','D'];

const tbody = document.querySelector('#matrix tbody');
const outputSpan = document.getElementById('output');
const qrOutput = document.getElementById('qrOutput');

let finalO = null;
let simInterval;

// マトリックス生成

let cellMap = {};
let cellNumber = 1;

verticalLabels.forEach((vLabel)=>{

    const row = document.createElement('tr');

    const rowHeader = document.createElement('th');
    rowHeader.textContent = vLabel;
    row.appendChild(rowHeader);

    horizontalLabels.forEach((hLabel)=>{

        const cell = document.createElement('td');

        cell.textContent = `${vLabel}${hLabel}`;

        cell.setAttribute(
            'id',
            'cell-' + cellNumber
        );

        cellMap[cellNumber] = cell;

        row.appendChild(cell);

        cellNumber++;

    });

    tbody.appendChild(row);

});

// マトリックス選択

function selectMatrix(){

    const input = parseInt(
        document.getElementById('matrixInput').value
    );

    document
        .querySelectorAll('.selected')
        .forEach(el=>el.classList.remove('selected'));

    if(cellMap[input]){

        cellMap[input].classList.add('selected');

        document.getElementById('calcSection').style.display='block';

    }

}

// シミュレーション開始

function startSimulation(){

    const bond = parseFloat(
        document.getElementById('bondInput').value
    );

    const stock = parseFloat(
        document.getElementById('stockInput').value
    );

    const t = parseFloat(
        document.getElementById('tInput').value
    );

    if(
        isNaN(bond) ||
        isNaN(stock) ||
        isNaN(t) ||
        t===0
    ){

        alert(
            '全ての数値を正しく入力してください（T≠0）'
        );

        return;
    }

    const baseO = (bond-stock)/t;

    let step = 0;
    let totalSteps = 30;

    clearInterval(simInterval);

    simInterval = setInterval(()=>{

        if(step>=totalSteps){

            clearInterval(simInterval);

        }else{

            const fluctuation =
                (Math.random()-0.5)*0.2;

            const fluctuatedO =
                (
                    baseO *
                    (1+fluctuation)
                ).toFixed(2);

            outputSpan.textContent =
                fluctuatedO;

            finalO = fluctuatedO;

            step++;

        }

    },100);

}

// 停止

function stopSimulation(){

    clearInterval(simInterval);

    if(finalO!==null){

        const qrDiv =
            document.getElementById('qrcode');

        qrDiv.innerHTML = '';

        new QRCode(qrDiv,{
            text:finalO,
            width:128,
            height:128
        });

    }

}

// QR読み取り

function readQRCode(){

    if(finalO!==null){

        qrOutput.textContent = finalO;

    }else{

        qrOutput.textContent = '--';

    }

}

</script>

</body>
</html>
